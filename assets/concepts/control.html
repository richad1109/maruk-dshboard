<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Control · Kantor Rakus</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111d;color:#eaf5fb;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.orbit{position:relative;min-height:610px;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 59% 38%,#113041 0,transparent 55%),linear-gradient(145deg,#0b1a2a,#060d17)}.orbit:before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(#468aac09 1px,transparent 1px),linear-gradient(90deg,#468aac09 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(#000,transparent)}header{padding:30px 34px 0;display:flex;justify-content:space-between;gap:18px;position:relative;z-index:2}.brand{font-size:11px;font-weight:700;letter-spacing:.24em;color:#7da2ba}.brand b{color:#b4edff}.state{display:flex;gap:7px;align-items:center;color:#76d8ef;font-size:9px;letter-spacing:.13em}.state i{display:block;width:5px;height:5px;border-radius:50%;background:#80def8;box-shadow:0 0 10px #56d2ff}h1{font-size:clamp(28px,4vw,38px);font-weight:400;letter-spacing:-.06em;margin:16px 0 8px}h1 em{font-family:Georgia,serif;color:#8bdbef;font-weight:400}.intro{color:#7c9bb0;font-size:11px;line-height:1.6;margin:0}.tag{font-size:8px;letter-spacing:.18em;color:#54738a;position:absolute;top:128px;right:34px;writing-mode:vertical-rl}.scene{position:relative;height:405px;margin-top:-8px;cursor:grab;touch-action:pan-y}.scene:active{cursor:grabbing}canvas{display:block;width:100%;height:100%}.compass{position:absolute;bottom:12px;left:35px;font-size:9px;letter-spacing:.14em;color:#51768d}.compass:before{content:"+";font-size:17px;vertical-align:-2px;margin-right:9px;color:#85c9de}.caption{position:absolute;right:34px;bottom:12px;font-size:9px;letter-spacing:.1em;color:#65879d}.bottom{margin:0 34px;padding-top:17px;border-top:1px solid #2c52633d;display:flex;justify-content:space-between;align-items:center;gap:12px}.detail{display:flex;gap:23px}.detail span{display:block;font-size:8px;letter-spacing:.17em;color:#557489;margin-bottom:6px}.detail b{font-size:11px;letter-spacing:.04em;font-weight:400;color:#9fb9c9}.controls{display:flex;gap:5px}button{width:34px;height:33px;border:1px solid #37657b63;border-radius:7px;background:#0e2333;color:#a5d8e6;cursor:pointer;font-size:13px}button:hover,button:focus-visible{outline:1px solid #8bddf5;background:#143a4c}button[aria-pressed=true]{background:#19485a}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:520px){.orbit{min-height:500px}header{padding:23px 21px 0}.brand{font-size:9px}.state{font-size:7px}h1{margin-top:15px}.intro{font-size:10px;max-width:260px}.scene{height:302px;margin-top:8px}.bottom{margin:0 21px;padding-top:13px}.detail{gap:15px}.detail b{font-size:10px}.detail span{font-size:7px}.tag{right:16px;top:137px;font-size:7px}.caption{right:20px;bottom:8px;font-size:7px}.compass{left:22px;bottom:8px;font-size:7px}button{width:29px;height:30px}.controls{gap:4px}}
</style></head><body><main class="orbit" aria-label="Kandidat 2 Orbit Control, kantor 3D ilustratif"><header><div><div class="brand">KANTOR <b>RAKUS</b> / 02</div><h1>Clarity in <em>motion.</em></h1><p class="intro">Ruang kendali yang tenang.<br>Tiga meja, satu pusat pandangan.</p></div><div class="state"><i></i>ORBIT CONTROL</div></header><div class="tag">KONSEP VISUAL · BUKAN DATA PASAR</div><div class="scene" tabindex="0" role="group" aria-label="Geser untuk memutar ruang. Tombol panah untuk mengubah sudut."><canvas aria-hidden="true"></canvas><div class="compass">FLOOR 03 / KANTOR RAKUS</div><div class="caption">DRAG TO EXPLORE</div></div><div class="bottom"><div class="detail"><div><span>ARSITEKTUR</span><b>Midnight glass</b></div><div><span>SUASANA</span><b>Calm precision</b></div></div><div class="controls"><button data-action="left" aria-label="Putar kiri">↶</button><button data-action="pause" aria-label="Jeda animasi" aria-pressed="false">Ⅱ</button><button data-action="right" aria-label="Putar kanan">↷</button><button data-action="reset" aria-label="Reset sudut">⤾</button></div></div></main><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),scene=document.querySelector('.scene');let W=0,H=0,scale=1,yaw=-.17,tilt=.64,drag=false,lastX=0,manual=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,previous=0;const pause=document.querySelector('[data-action=pause]');function pauseUI(){pause.textContent=paused?'▶':'Ⅱ';pause.setAttribute('aria-pressed',String(paused));pause.setAttribute('aria-label',paused?'Lanjut animasi':'Jeda animasi')}pauseUI();function resize(){let r=scene.getBoundingClientRect();W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(W/690,H/394)}new ResizeObserver(resize).observe(scene);function p(x,y,z){let cs=Math.cos(yaw),sn=Math.sin(yaw),a=x*cs-z*sn,b=x*sn+z*cs;return[W*.5+a*scale,H*.57+(b*.47-y*.83)*scale]}function poly(points,color,stroke){ctx.beginPath();points.forEach((q,i)=>{let a=p(...q);i?ctx.lineTo(...a):ctx.moveTo(...a)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7*scale;ctx.stroke()}}function line(points,color,width=1){ctx.beginPath();points.forEach((q,i)=>{let a=p(...q);i?ctx.lineTo(...a):ctx.moveTo(...a)});ctx.strokeStyle=color;ctx.lineWidth=width*scale;ctx.stroke()}function box(x,y,z,w,h,d,top,front,side){poly([[x-w/2,y,z+d/2],[x+w/2,y,z+d/2],[x+w/2,y+h,z+d/2],[x-w/2,y+h,z+d/2]],front);poly([[x+w/2,y,z-d/2],[x+w/2,y,z+d/2],[x+w/2,y+h,z+d/2],[x+w/2,y+h,z-d/2]],side);poly([[x-w/2,y+h,z-d/2],[x+w/2,y+h,z-d/2],[x+w/2,y+h,z+d/2],[x-w/2,y+h,z+d/2]],top)}function ellipse3(x,y,z,rx,rz,color,width=1,start=0,end=Math.PI*2){let pts=[];for(let a=start;a<=end+.05;a+=.06)pts.push([x+Math.cos(a)*rx,y,z+Math.sin(a)*rz]);line(pts,color,width)}function glow(x,y,z,r,color){let a=p(x,y,z),g=ctx.createRadialGradient(...a,0,...a,r*scale);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(a[0]-r*scale,a[1]-r*scale,r*scale*2,r*scale*2)}function screen(x,y,z,w,h,phase){box(x,y,z,w,h,3,'#31637b','#112b3f','#1d445b');poly([[x-w*.43,y+3,z+1.6],[x+w*.43,y+3,z+1.6],[x+w*.43,y+h-3,z+1.6],[x-w*.43,y+h-3,z+1.6]],'#082132');for(let i=0;i<3;i++){let points=[];for(let j=0;j<24;j++){let u=j/23;points.push([x-w*.37+u*w*.74,y+h*.25+i*h*.2+Math.sin(u*7+phase+i+time*.3)*h*.075,z+1.8])}line(points,i===0?'#68d9ed':i===1?'#356e8c':'#254e68',.85)}line([[x-w*.34,y+h*.84,z+1.8],[x-w*.09,y+h*.84,z+1.8]],'#a0d2df',1.5)}function desk(x,z,i){box(x,0,z,5,55,5,'#2c5364','#163343','#102632');box(x-45,0,z,5,55,5,'#2c5364','#163343','#102632');box(x+45,0,z,5,55,5,'#2c5364','#163343','#102632');box(x,55,z,113,6,52,'#244b60','#122f42','#19394c');line([[x-55,59,z+27],[x+55,59,z+27]],'#69b7ca',1.1);box(x,61,z-13,4,12,4,'#365e71','#1e4155','#244859');screen(x,72,z-15,58,34,i);screen(x-41,72,z-12,20,29,i+1);box(x+8,62,z+12,36,1.7,10,'#375b6e','#1a394b','#1a394b');box(x+38,62,z+13,6,2,8,'#507080','#1e4054','#1e4054');box(x-34,62,z+10,6,8,6,'#5c8393','#3a6172','#284959');box(x+4,22,z+52,26,7,26,'#294959','#173747','#173242');box(x+4,29,z+64,26,27,6,'#385666','#1b3a4e','#173242');box(x+4,0,z+52,3,25,3,'#527185','#274557','#213d4f');line([[x-7,2,z+44],[x+15,2,z+61]],'#527185',2);line([[x-7,2,z+61],[x+15,2,z+44]],'#527185',2);/* abstract seated figure */box(x+4,30,z+49,17,27,11,'#557584','#335368','#274454');let head=p(x+4,64,z+48);ctx.fillStyle='#658291';ctx.beginPath();ctx.ellipse(head[0],head[1],6.3*scale,7.3*scale,0,0,7);ctx.fill();line([[x-2,50,z+47],[x-9,49,z+27],[x+1,61,z+14]],'#41677b',4);let sip=i===1?Math.pow(Math.max(0,Math.sin(time*.38)),8):0;let hand=[x+21-11*sip,61+3*sip,z+15+30*sip];line([[x+11,50,z+47],[x+20,49,z+29],hand],'#41677b',4);box(hand[0],hand[1],hand[2],5,7,5,'#a9c8cc','#769aa7','#527786');let typing=Math.sin(time*7+i)*1.5;line([[x-2,50,z+47],[x-9,49,z+27],[x+1,61+typing,z+14]],'#7294a6',2)}function draw(t){if(!previous)previous=t;let dt=Math.min((t-previous)/1000,.05);previous=t;if(!paused&&!drag&&document.visibilityState==='visible')time+=dt;yaw=-.17+manual+Math.sin(time*.14)*.045;ctx.clearRect(0,0,W,H);glow(0,20,-60,280,'#1b61702a');/* distant floating city silhouette */for(let k=0;k<15;k++){let x=-240+k*34,h=25+(k*31%63);box(x,0,-170,21,h,17,'#122d40','#102637','#0c2031');for(let a=0;a<4;a++)line([[x-4,10+a*12,-160],[x+4,10+a*12,-160]],'#3e71844d',.7)}/* architectural rear wall */poly([[-268,0,-140],[268,0,-140],[268,184,-140],[-268,184,-140]],'#173f5028','#3b718557');for(let x=-268;x<=268;x+=67)line([[x,0,-139],[x,184,-139]],'#50768a7a',1);for(let y=12;y<184;y+=55)line([[-268,y,-139],[268,y,-139]],'#446c7d66',1);line([[-268,184,-139],[268,184,-139]],'#7dc6d6',2);/* wall name plaque */poly([[-90,142,-138],[90,142,-138],[90,169,-138],[-90,169,-138]],'#102c3e');let label=p(0,153,-137);ctx.save();ctx.translate(...label);ctx.fillStyle='#a3d5e6';ctx.font=`${9*scale}px Arial`;ctx.textAlign='center';ctx.fillText('K A N T O R   R A K U S',0,0);ctx.restore();/* floor */box(0,-14,35,570,14,315,'#132f41','#0c2333','#0c2333');for(let x=-270;x<=270;x+=30)line([[x,.3,-119],[x,.3,188]],'#46768c1f',.6);for(let z=-119;z<190;z+=30)line([[-270,.3,z],[270,.3,z]],'#46768c1f',.6);line([[-285,-1,192],[285,-1,192]],'#6ac0da',1.5);line([[285,-1,192],[285,-1,-121]],'#457c96',1.5);/* central sculpture */box(0,0,-65,62,13,56,'#29566a','#15384e','#1b3f54');ellipse3(0,14,-65,25,21,'#5bbbd0',1);let orbY=62+Math.sin(time*.8)*3;glow(0,orbY,-65,52,'#6bd6e832');for(let ring=0;ring<5;ring++){let angle=(ring-2)*.3,pts=[];for(let a=0;a<6.35;a+=.06){let x=Math.cos(a)*27,y=Math.sin(a)*27;pts.push([x*Math.cos(angle),orbY+y,-65+x*Math.sin(angle)])}line(pts,ring===2?'#96edf4aa':'#66cde455',.9)}ellipse3(0,orbY,-65,34,16,'#8fd7e5a0',1);let orbit=time*.7;glow(Math.cos(orbit)*34,orbY,-65+Math.sin(orbit)*16,5,'#c8fbff');line([[0,14,-65],[0,orbY-28,-65]],'#5ebbd444',1);/* plant towers */for(let x of[-248,248]){box(x,0,-70,21,24,21,'#31515d','#1c3949','#15303e');for(let j=0;j<7;j++){let z=-70+(j%3-1)*7;line([[x,24,-70],[x+Math.sin(j*2)*15,55+j%3*10,z]],'#3d6f70',2.5);let a=p(x+Math.sin(j*2)*15,55+j%3*10,z);ctx.fillStyle=j%2?'#467e79':'#315f64';ctx.beginPath();ctx.ellipse(a[0],a[1],7*scale,3*scale,j*.8,0,7);ctx.fill()}}desk(-176,40,0);desk(0,72,1);desk(176,40,2);/* office floor lead, illustrative */let walkX=Math.sin(time*.17)*235,walkZ=147;box(walkX,27,walkZ,19,29,12,'#73979f','#416878','#2a4b5e');let face=p(walkX,65,walkZ);ctx.fillStyle='#b69c83';ctx.beginPath();ctx.ellipse(face[0],face[1],6*scale,7*scale,0,0,7);ctx.fill();let step=Math.sin(time*7)*6;line([[walkX-5,28,walkZ],[walkX-5,3,walkZ+step]],'#688a98',4);line([[walkX+5,28,walkZ],[walkX+5,3,walkZ-step]],'#688a98',4);line([[walkX-12,50,walkZ],[walkX-15,29,walkZ-step]],'#829da3',3);line([[walkX+12,50,walkZ],[walkX+15,29,walkZ+step]],'#829da3',3);/* front architectural glass edge */for(let x of[-278,278]){line([[x,0,170],[x,78,170]],'#6c9caf80',1);glow(x,2,170,10,'#71d2e442')}/* moving floor signal pulse, decorative */if(!paused){let x=-240+(time*22%480);glow(x,1,176,15,'#72e2ff39')}requestAnimationFrame(draw)}requestAnimationFrame(draw);scene.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;scene.setPointerCapture(e.pointerId)});scene.addEventListener('pointermove',e=>{if(drag){manual=Math.max(-.35,Math.min(.35,manual+(e.clientX-lastX)*.002));lastX=e.clientX}});scene.addEventListener('pointerup',()=>drag=false);scene.addEventListener('pointercancel',()=>drag=false);scene.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){manual=Math.max(-.35,Math.min(.35,manual+(e.key==='ArrowLeft'?-.06:.06)));e.preventDefault()}});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.action;if(a==='pause'){paused=!paused;pauseUI()}if(a==='left')manual=Math.max(-.35,manual-.08);if(a==='right')manual=Math.min(.35,manual+.08);if(a==='reset'){manual=0;time=0}}));})();
</script></body></html>
