<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head><body><div class="kr-office" id="kr-office" aria-label="Kantor Rakus tiga dimensi interaktif">
<style>
.kr-office{--accent:#b9ef78;position:relative;height:365px;border:1px solid #31463a;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 78%,#2a4338 0, #101c23 49%,#0e151d 80%);font-family:Arial,sans-serif;color:#dce7e2;isolation:isolate}.kr-office *{box-sizing:border-box}.kr-office .kr-top{position:absolute;top:19px;left:22px;z-index:5;font-size:10px;letter-spacing:2px;color:#95a99d}.kr-office .kr-top b{display:block;font-size:20px;color:#e2eee4;letter-spacing:-.7px;margin-top:7px}.kr-office .kr-live{position:absolute;right:20px;top:22px;font-size:9px;border:1px solid #476043;border-radius:20px;padding:6px 9px;color:var(--accent)}.kr-office .kr-live:before{content:'●';margin-right:7px}.kr-office .kr-view{position:absolute;inset:20px 0 0;perspective:900px;touch-action:pan-y;cursor:grab}.kr-office .kr-world{position:absolute;left:50%;top:56%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-26deg) rotateY(-32deg) scale(.73)}.kr-office .kr-box{position:absolute;transform-style:preserve-3d}.kr-office .kr-face{position:absolute;backface-visibility:hidden;border:1px solid #ffffff09;display:flex;align-items:center;justify-content:center;color:#a3d99a;overflow:hidden}.kr-office .kr-face.glass{border:1px solid #8abfa548;background:linear-gradient(135deg,#a8e4da12,#95e8bf05)!important}.kr-office .kr-label{font-size:15px;font-weight:bold;letter-spacing:2px;white-space:nowrap}.kr-office .kr-screen{display:block;position:relative;width:95%;height:85%;background:linear-gradient(130deg,#132f26,#132633);box-shadow:inset 0 0 20px #b9ef7815}.kr-office .kr-screen:before{content:'SAKTI / TRADING DESK';position:absolute;left:8%;top:10%;font-size:5px;letter-spacing:1px;color:#bedfba}.kr-office .kr-screen:after{content:'';position:absolute;inset:34% 8% 12%;background:linear-gradient(160deg,transparent 45%,#a6ed7844 47%,transparent 49%),repeating-linear-gradient(90deg,#b9ef78 0 3px,transparent 3px 8px);clip-path:polygon(0 80%,8% 60%,16% 75%,24% 35%,32% 55%,40% 45%,48% 65%,56% 25%,64% 35%,72% 12%,80% 30%,88% 0,100% 10%,100% 100%,0 100%);opacity:.7;animation:kr-screen 3s ease-in-out infinite alternate}.kr-office .kr-bottom{position:absolute;bottom:19px;left:22px;right:20px;z-index:5;display:flex;align-items:center;justify-content:space-between;font-size:9px;color:#a2b2aa}.kr-office .kr-controls{display:flex;gap:6px}.kr-office button{background:#1a2827;color:#c5d9cd;border:1px solid #45604c;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:10px;min-width:30px}.kr-office button:hover,.kr-office button:focus-visible{background:#324b35;outline:1px solid #b9ef78}.kr-office .kr-shine{position:absolute;width:400px;height:80px;left:calc(50% - 200px);bottom:70px;background:#b9ef7815;border-radius:50%;filter:blur(25px)}@keyframes kr-screen{to{opacity:.45}}@media(prefers-reduced-motion:reduce){.kr-office .kr-screen:after{animation:none}}@media(max-width:550px){.kr-office{height:330px}.kr-office .kr-world{transform:rotateX(-26deg) rotateY(-32deg) scale(.55)}}
</style>
<div class="kr-top">KANTOR RAKUS<b>The trading floor.</b></div><div class="kr-live">READ ONLY</div>
<div class="kr-shine"></div><div class="kr-view" tabindex="0" role="img" aria-label="Geser untuk memutar kantor. Gunakan tombol kiri dan kanan untuk rotasi."><div class="kr-world"></div></div>
<div class="kr-bottom"><span>3 DESKS · 8 WALLETS<br><small style="display:block;margin-top:5px;color:#6d8479">Geser untuk melihat ruang · visual ilustrasi kantor</small></span><div class="kr-controls"><button data-dir="left" aria-label="Putar kiri">←</button><button data-dir="pause" aria-label="Jeda atau lanjut animasi">Ⅱ</button><button data-dir="right" aria-label="Putar kanan">→</button><button data-dir="reset" aria-label="Reset sudut pandang">↺</button></div></div>
<script>
(()=>{const root=document.getElementById('kr-office');if(!root||root.dataset.ready)return;root.dataset.ready='1';const world=root.querySelector('.kr-world');
function box(x,y,z,w,h,d,c,front='',glass=false){const b=document.createElement('div');b.className='kr-box';b.style.transform=`translate3d(${x-w/2}px,${y-h/2}px,${z}px)`;const faces=[['front',w,h,`translateZ(${d/2}px)`],['back',w,h,`rotateY(180deg) translateZ(${d/2}px)`],['right',d,h,`translateX(${w-d/2}px) rotateY(90deg)`],['left',d,h,`translateX(${-d/2}px) rotateY(-90deg)`],['top',w,d,`translateY(${-d/2}px) rotateX(90deg)`],['bottom',w,d,`translateY(${h-d/2}px) rotateX(-90deg)`]];for(const [name,fw,fh,tr]of faces){const f=document.createElement('div');f.className='kr-face'+(glass?' glass':'');f.style.cssText=`width:${fw}px;height:${fh}px;transform:${tr};background:${name==='top'?c[0]:name==='front'?c[1]:c[2]};`;if(name==='front'&&front)f.innerHTML=front;b.append(f)}world.append(b)}
box(0,85,0,420,18,280,['#263b35','#314a40','#15271f']);
box(0,-8,-135,420,180,8,['#294438','#15271f','#13251e']);
box(-205,-8,0,8,180,275,['#294438','#193129','#20382b'], '',true);
box(0,-61,-128,230,36,3,['#4d7554','#233a2c','#294532'],'<span class="kr-label">KANTOR RAKUS</span>');
box(0,67,138,420,3,3,['#a6de75','#a6de75','#a6de75']);
for(let i=0;i<3;i++){const x=(i-1)*125;box(x,12,0,110,7,65,['#4b6455','#354b3d','#24392e']);box(x,-13,-22,65,42,5,['#34564d','#152821','#1d352d'],'<div class="kr-screen"></div>');box(x,8,-22,4,12,4,['#7a8a7a','#576958','#344a3c']);box(x,8,9,44,2,14,['#344b40','#20352a','#172c22']);for(const dx of [-43,43])box(x+dx,46,0,5,63,48,['#1f392b','#1a3026','#17281f']);box(x,48,65,43,10,38,['#435c48','#354c3b','#243c2b']);box(x,25,83,43,47,7,['#405c45','#304c38','#243c2b']);box(x,69,65,6,34,6,['#607b66','#334d3a','#2a3c2e']);}
for(const [x,z]of [[180,-92],[-180,93]]){box(x,65,z,22,25,22,['#61705c','#425841','#314831']);box(x,30,z,45,49,34,['#53835d','#3b6746','#2a4e35'])}
for(let i=0;i<4;i++)box(164,-20+i*22,-128,42,10,4,['#284735','#8cbd6d','#25422e']);
let angle=-32,tilt=-26,drag=false,lastX=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,frame=0,previous=0;
function draw(t){if(!root.isConnected){cancelAnimationFrame(frame);return}if(!paused&&!drag&&document.visibilityState==='visible')angle+=Math.min(t-previous||16,40)*.0025;previous=t;let scale=root.clientWidth<440?.57:.73;world.style.transform=`rotateX(${tilt}deg) rotateY(${angle}deg) scale(${scale})`;frame=requestAnimationFrame(draw)}frame=requestAnimationFrame(draw);
const view=root.querySelector('.kr-view');view.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-lastX)*.45;lastX=e.clientX}});view.addEventListener('pointerup',()=>drag=false);view.addEventListener('pointercancel',()=>drag=false);root.querySelectorAll('button').forEach(b=>b.onclick=()=>{const d=b.dataset.dir;if(d==='left')angle-=25;if(d==='right')angle+=25;if(d==='pause'){paused=!paused;b.textContent=paused?'▶':'Ⅱ';b.setAttribute('aria-pressed',String(paused))}if(d==='reset'){angle=-32;tilt=-26}});
})();
</script></div></body></html>
